// Throwaway DB-backed participant for the external-party-with-state spike
// only — import_party_acs (like repair.import_acs) refuses memory storage,
// and participant2/3 are memory by design. Not part of docker-compose, not
// touched by the real demo.
canton {
  participants {
    participant5 {
      storage {
        type = "h2"
        config {
          url = "jdbc:h2:mem:participant5;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000"
          user = "canton"
          password = ""
          driver = "org.h2.Driver"
        }
      }
      admin-api {
        address = "0.0.0.0"
        port = 5052
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5051
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5053
      }
    }
  }
}
