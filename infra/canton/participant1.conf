// Participant node "participant1" — runs in its own container.
// Storage: H2, persisted to disk (see the participant1_data volume in
// docker-compose.yml) — deliberately, permanently, not a dev-only
// convenience. This is also more realistic: a real disaster corrupts or
// loses the disk, it doesn't just crash the process. The demo's
// "destruction" beat is therefore `docker volume rm` on participant1_data
// (after stopping/removing the container), not `docker stop` — see
// docs/DEMO_SCRIPT_SKELETON.md and CLAUDE.md's operational note.
canton {
  participants {
    participant1 {
      storage {
        type = "h2"
        config {
          url = "jdbc:h2:file:/canton/data/participant1;LOCK_TIMEOUT=10000"
          user = "canton"
          password = ""
          driver = "org.h2.Driver"
        }
      }
      admin-api {
        address = "0.0.0.0"
        port = 5012
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5011
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5013
      }
    }
  }
}
