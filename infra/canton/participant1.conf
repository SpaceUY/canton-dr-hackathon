// Participant node "participant1" — runs in its own container.
// Storage: H2, persisted to disk (see the participant1_data volume in
// docker-compose.yml) — deliberately, permanently, not a dev-only
// convenience. This is also more realistic: a real disaster corrupts or
// loses the disk, it doesn't just crash the process. The demo's
// "destruction" beat is therefore `docker volume rm` on participant1_data
// (after stopping/removing the container), not `docker stop` — see
// docs/README.md ("Running the demo end to end") and ADR-006 in docs/DECISIONS.md.
canton {
  participants {
    participant1 {
      storage {
        type = "h2"
        config {
          url = "jdbc:h2:file:/canton/data/participant1;LOCK_TIMEOUT=10000"
          user = "canton"
          password = ""
          driver = "org.h2.Driver"
        }
      }
      admin-api {
        address = "0.0.0.0"
        port = 5012
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5011
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5013
        // The JSON API's active-contracts POST refuses to return more than
        // its list limit (200 by default here: JSON_API_MAXIMUM_LIST_ELEMENTS_NUMBER_REACHED),
        // and the agent's queryActive reads a party's whole ACS through it -
        // so any party with >200 active contracts broke the dashboard,
        // verify-demo-state, counterparty-tx and recover's identity check.
        // Found by the 1000-contract scale test (scripts/scale-test.sh).
        websocket-config {
          http-list-max-elements-limit = 100000
        }
      }
    }
  }
}
