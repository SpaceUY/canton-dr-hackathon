// Participant node "participant1" — runs in its own container.
// In-memory storage: recreating this container is equivalent to this node
// losing its base, which is exactly the failure the demo needs to produce.
//
// TEMPORARY (feature/identity-recovery branch only): switched to H2 below
// while iterating on identity recovery, which means killing/recreating
// this container repeatedly — with memory storage that also wipes
// participant1's own identity each time, forcing a full environment reset
// (see spikes/external-party/FINDINGS.md and project memory). MUST revert
// to `storage.type = memory` before the real demo, so the destruction
// still looks total.
canton {
  participants {
    participant1 {
      storage {
        type = "h2"
        config {
          url = "jdbc:h2:file:/canton/data/participant1;LOCK_TIMEOUT=10000"
          user = "canton"
          password = ""
          driver = "org.h2.Driver"
        }
      }
      admin-api {
        address = "0.0.0.0"
        port = 5012
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5011
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5013
      }
    }
  }
}
