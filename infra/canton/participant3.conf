// Participant node "participant3" — runs in its own container.
// In-memory storage: recreating this container is equivalent to this node
// losing its base, which is exactly the failure the demo needs to produce.
canton {
  participants {
    participant3 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 5032
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5031
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5033
      }
    }
  }
}
