// Participant node "participant2" — runs in its own container.
// In-memory storage: recreating this container is equivalent to this node
// losing its base, which is exactly the failure the demo needs to produce.
//
// Tried H2 here too alongside participant1 (feature/identity-recovery
// branch) to survive repeated kills during identity-recovery dev — reverted
// back to memory: participant1+participant2 both migrating H2 for the
// first time simultaneously caused persistent DB_CONNECTION_LOST timeouts
// on this machine and bootstrap never completed (11+ min, normally ~20s).
// See spikes/external-party/FINDINGS.md. Only participant1 (the one the
// demo actually kills) stays on H2; participant2 back to memory.
canton {
  participants {
    participant2 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 5022
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5021
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5023
      }
    }
  }
}
