// Participant node "participant2" — runs in its own container.
// In-memory storage: recreating this container is equivalent to this node
// losing its base, which is exactly the failure the demo needs to produce.
canton {
  participants {
    participant2 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 5022
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5021
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5023
      }
    }
  }
}
