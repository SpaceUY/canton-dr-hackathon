// Synchronizer node: sequencer1 + mediator1 in a single process.
// Not a custodian — this is coordination/ordering only, so in-memory storage is fine
// even once the participants below switch to something durable.
canton {
  sequencers {
    sequencer1 {
      storage.type = memory
      public-api {
        address = "0.0.0.0"
        port = 5001
      }
      admin-api {
        address = "0.0.0.0"
        port = 5002
      }
      sequencer.type = BFT
    }
  }
  mediators {
    mediator1 {
      storage.type = memory
      admin-api {
        address = "0.0.0.0"
        port = 5202
      }
    }
  }
}
