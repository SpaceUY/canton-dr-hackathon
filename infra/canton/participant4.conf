// Participant node "participant4" — the empty node a recovery lands on.
// Unlike participant1/2/3, this one needs database-backed storage: Canton's
// repair.import_acs refuses `storage.type = memory` outright (see
// "Step 2 findings" in ../README.md).
canton {
  participants {
    participant4 {
      storage {
        type = "h2"
        config {
          url = "jdbc:h2:file:/canton/data/participant4;LOCK_TIMEOUT=10000"
          user = "canton"
          password = ""
          driver = "org.h2.Driver"
        }
      }
      admin-api {
        address = "0.0.0.0"
        port = 5042
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5041
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 5043
        // The JSON API's active-contracts POST refuses to return more than
        // its list limit (200 by default here: JSON_API_MAXIMUM_LIST_ELEMENTS_NUMBER_REACHED),
        // and the agent's queryActive reads a party's whole ACS through it -
        // so any party with >200 active contracts broke the dashboard,
        // verify-demo-state, counterparty-tx and recover's identity check.
        // Found by the 1000-contract scale test (scripts/scale-test.sh).
        websocket-config {
          http-list-max-elements-limit = 100000
        }
      }
    }
  }
}
