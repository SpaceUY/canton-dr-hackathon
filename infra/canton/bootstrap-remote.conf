// Console-only config: no nodes of its own, just connection points to the
// nodes started by the other containers. Used by the one-shot `bootstrap`
// service to wire up the topology, then exits.
canton {
  remote-sequencers.sequencer1 {
    public-api { address = "synchronizer", port = 5001 }
    admin-api { address = "synchronizer", port = 5002 }
  }
  remote-mediators.mediator1 {
    admin-api { address = "synchronizer", port = 5202 }
  }
  remote-participants.participant1 {
    ledger-api { address = "participant1", port = 5011 }
    admin-api { address = "participant1", port = 5012 }
  }
  remote-participants.participant2 {
    ledger-api { address = "participant2", port = 5021 }
    admin-api { address = "participant2", port = 5022 }
  }
  remote-participants.participant3 {
    ledger-api { address = "participant3", port = 5031 }
    admin-api { address = "participant3", port = 5032 }
  }
  remote-participants.participant4 {
    ledger-api { address = "participant4", port = 5041 }
    admin-api { address = "participant4", port = 5042 }
  }
}
